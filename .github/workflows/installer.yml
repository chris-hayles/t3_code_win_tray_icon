name: Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1
          if (-not (Test-Path dist\T3ServeTray-setup.exe)) {
            throw "dist\T3ServeTray-setup.exe was not produced"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: T3ServeTray-setup
          path: dist/T3ServeTray-setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/T3ServeTray-setup.exe
